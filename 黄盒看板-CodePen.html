<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黄盒缺货补货看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-white border-b border-slate-100 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-800">黄盒缺货补货看板</h1>
        <p class="text-xs text-slate-400 mt-0.5">演示数据 · 美国仓 · 2026-05-06</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 text-xs bg-green-50 text-green-600 border border-green-200 px-3 py-1.5 rounded-full">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          系统正常
        </span>
        <button class="text-xs bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition cursor-not-allowed opacity-60" title="仅演示">上传 Excel</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6">

    <div class="grid grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm text-center">
        <div class="text-3xl font-bold text-red-500">3</div>
        <div class="text-sm text-slate-400 mt-1">紧急（R）SKU</div>
      </div>
      <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm text-center">
        <div class="text-3xl font-bold text-orange-500">12</div>
        <div class="text-sm text-slate-400 mt-1">预警（O）SKU</div>
      </div>
      <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm text-center">
        <div class="text-3xl font-bold text-yellow-500">7</div>
        <div class="text-sm text-slate-400 mt-1">关注（Y）SKU</div>
      </div>
      <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm text-center">
        <div class="text-3xl font-bold text-green-500">48</div>
        <div class="text-sm text-slate-400 mt-1">正常（G）SKU</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm">
        <h3 class="text-sm font-semibold mb-4">预警等级分布</h3>
        <canvas id="chartAlert" height="180"></canvas>
      </div>
      <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm">
        <h3 class="text-sm font-semibold mb-4">近 4 周调拨量趋势</h3>
        <canvas id="chartTrend" height="180"></canvas>
      </div>
    </div>

    <div class="bg-white rounded-xl p-4 border border-slate-100 shadow-sm mb-4 flex flex-wrap gap-3 items-center">
      <select class="text-sm border border-slate-200 rounded-lg px-3 py-2">
        <option>商品等级：全部</option>
        <option>A</option><option>B</option><option>C</option>
      </select>
      <select class="text-sm border border-slate-200 rounded-lg px-3 py-2">
        <option>预警级别：全部</option>
        <option>R 紧急</option><option>O 预警</option><option>Y 关注</option><option>G 正常</option>
      </select>
      <input type="text" placeholder="搜索 SKU..." class="text-sm border border-slate-200 rounded-lg px-3 py-2 flex-1 min-w-[200px]" />
      <button class="text-sm bg-slate-100 text-slate-600 px-4 py-2 rounded-lg hover:bg-slate-200 transition cursor-not-allowed opacity-60" title="仅演示">导出 Excel</button>
    </div>

    <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
              <th class="px-4 py-3 text-center font-semibold border-b border-slate-100" colspan="2">主品参数</th>
              <th class="px-4 py-3 text-center font-semibold border-b border-slate-100" colspan="3">黄盒参数</th>
              <th class="px-4 py-3 text-center font-semibold border-b border-slate-100" colspan="3">计算结果</th>
              <th class="px-4 py-3 text-center font-semibold border-b border-slate-100" colspan="2">人工调整</th>
              <th class="px-4 py-3 text-center font-semibold border-b border-slate-100">预警</th>
            </tr>
            <tr class="bg-slate-50 text-slate-600 text-xs">
              <th class="px-4 py-2.5 border-b border-slate-100 text-left">主品SKU</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-right">90天日均销</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-left">黄盒SKU</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-right">海外仓可用</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-right">在途</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-right">预估需求</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-right">计算调拨</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-right">调整后</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-left">调整原因</th>
              <th class="px-4 py-2.5 border-b border-slate-100 text-center">等级</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-slate-700"></tbody>
        </table>
      </div>
    </div>

    <p class="text-xs text-slate-400 mt-3">显示 <span id="count">0</span> 条记录 · <span class="text-blue-500">演示数据</span></p>
  </main>

  <script>
    const data = [
      { mainSku: 'MAIN-001', dailyAvg: 32.5, boxSku: 'BOX-001', boxAvail: 15, boxTransit: 6, demand: 11.7, calc: 8.2, adjusted: 10, reason: '活动前备货', level: 'R' },
      { mainSku: 'MAIN-015', dailyAvg: 28.0, boxSku: 'BOX-015', boxAvail: 8, boxTransit: 3, demand: 10.1, calc: 20.1, adjusted: 20, reason: '按整箱调拨', level: 'R' },
      { mainSku: 'MAIN-038', dailyAvg: 45.0, boxSku: 'BOX-038', boxAvail: 20, boxTransit: 10, demand: 16.2, calc: 16.2, adjusted: 18, reason: '旺季备货', level: 'R' },
      { mainSku: 'MAIN-120', dailyAvg: 40.0, boxSku: 'BOX-120', boxAvail: 8, boxTransit: 3, demand: 14.4, calc: 3.4, adjusted: 4, reason: '按整箱调拨', level: 'O' },
      { mainSku: 'MAIN-075', dailyAvg: 35.0, boxSku: 'BOX-075', boxAvail: 12, boxTransit: 5, demand: 12.6, calc: 1.6, adjusted: 2, reason: '安全库存', level: 'O' },
      { mainSku: 'MAIN-042', dailyAvg: 22.0, boxSku: 'BOX-042', boxAvail: 5, boxTransit: 2, demand: 7.9, calc: 7.9, adjusted: 8, reason: '按整箱调拨', level: 'O' },
      { mainSku: 'MAIN-078', dailyAvg: 25.2, boxSku: 'BOX-078', boxAvail: 9, boxTransit: 4, demand: 9.1, calc: -3.9, adjusted: 2, reason: '安全库存上调', level: 'Y' },
      { mainSku: 'MAIN-055', dailyAvg: 18.0, boxSku: 'BOX-055', boxAvail: 30, boxTransit: 15, demand: 6.5, calc: -29.5, adjusted: 0, reason: '—', level: 'G' },
      { mainSku: 'MAIN-032', dailyAvg: 20.0, boxSku: 'BOX-032', boxAvail: 25, boxTransit: 10, demand: 7.2, calc: -27.8, adjusted: 0, reason: '—', level: 'G' },
      { mainSku: 'MAIN-088', dailyAvg: 15.0, boxSku: 'BOX-088', boxAvail: 40, boxTransit: 20, demand: 5.4, calc: -54.6, adjusted: 0, reason: '—', level: 'G' },
    ];

    const levelColors = { R: 'bg-red-100 text-red-700 border-red-200', O: 'bg-orange-100 text-orange-700 border-orange-200', Y: 'bg-yellow-100 text-yellow-700 border-yellow-200', G: 'bg-green-100 text-green-700 border-green-200' };
    const levelText = { R: 'R 紧急', O: 'O 预警', Y: 'Y 关注', G: 'G 正常' };

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-50 border-b border-slate-50 ${row.level === 'R' ? 'bg-red-50/30' : ''}">
          <td class="px-4 py-3 font-medium">${row.mainSku}</td>
          <td class="px-4 py-3 text-right">${row.dailyAvg}</td>
          <td class="px-4 py-3">${row.boxSku}</td>
          <td class="px-4 py-3 text-right">${row.boxAvail}</td>
          <td class="px-4 py-3 text-right">${row.boxTransit}</td>
          <td class="px-4 py-3 text-right">${row.demand}</td>
          <td class="px-4 py-3 text-right font-semibold ${row.calc < 0 ? 'text-green-600' : 'text-orange-600'}">${row.calc}</td>
          <td class="px-4 py-3 text-right">${row.adjusted}</td>
          <td class="px-4 py-3 text-xs text-slate-500">${row.reason}</td>
          <td class="px-4 py-3 text-center"><span class="inline-flex text-xs font-semibold px-2 py-0.5 rounded-full border ${levelColors[row.level]}">${levelText[row.level]}</span></td>
        </tr>
      `).join('');
      document.getElementById('count').textContent = data.length;
    }

    renderTable();

    new Chart(document.getElementById('chartAlert'), {
      type: 'doughnut',
      data: { labels: ['R 紧急', 'O 预警', 'Y 关注', 'G 正常'], datasets: [{ data: [3, 12, 7, 48], backgroundColor: ['#ef4444', '#f97316', '#eab308', '#22c55e'], borderWidth: 0 }] },
      options: { responsive: true, cutout: '60%', plugins: { legend: { position: 'bottom', labels: { padding: 12 } } } }
    });

    new Chart(document.getElementById('chartTrend'), {
      type: 'line',
      data: {
        labels: ['第 10 周', '第 11 周', '第 12 周', '第 13 周'],
        datasets: [
          { label: '计算调拨量', data: [285, 312, 298, 340], borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4 },
          { label: '实际调拨量', data: [280, 305, 310, 335], borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', fill: true, tension: 0.4 }
        ]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { padding: 12 } } }, scales: { y: { grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
    });
  </script>
</body>
</html>
